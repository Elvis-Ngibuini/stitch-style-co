name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20'

jobs:
  # Security scanning - runs first to fail fast
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for gitleaks to scan history

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config: .gitleaks.toml
          args: --verbose

      - name: Run npm audit
        run: npm audit --audit-level=high
        working-directory: .

      - name: Run npm audit (frontend)
        run: npm audit --audit-level=high
        working-directory: ./frontend-next

  # Backend tests
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: security
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://localhost:27017/stitch-style-co-test
      NODE_ENV: test
      JWT_SECRET: test-secret-key-min-32-characters-long-for-testing
      JWT_REFRESH_SECRET: test-refresh-secret-key-min-32-characters-long
      STRIPE_SECRET_KEY: sk_test_fake
      STRIPE_PUBLISHABLE_KEY: pk_test_fake
      STRIPE_WEBHOOK_SECRET: whsec_fake
      FRONTEND_URL: http://localhost:3000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint --if-present

  # Frontend tests
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend-next

      - name: Run lint
        run: npm run lint
        working-directory: ./frontend-next

      - name: Type check
        run: npx tsc --noEmit
        working-directory: ./frontend-next

      - name: Build
        run: npm run build
        working-directory: ./frontend-next
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5006/api
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_fake

  # Backend build & docker
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: stitch-style/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Frontend build & docker
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-next
          push: false
          tags: stitch-style/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Staging deploy
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # e.g., kubectl apply -f k8s/staging/
          # or docker compose -f docker-compose.staging.yml up -d

  # Production deploy (manual approval)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # Requires manual approval in GitHub environment settings