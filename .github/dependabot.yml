version: 2
updates:
  # Backend dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    groups:
      development-dependencies:
        patterns:
          - "*"
          - "@types/*"
          - "eslint*"
          - "jest*"
          - "prettier*"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "express"
          - "mongoose"
          - "jsonwebtoken"
          - "bcryptjs"
          - "stripe"
          - "helmet"
          - "cors"
          - "cookie-parser"
          - "zod"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "backend"
    reviewers:
      - "elvis"
    assignees:
      - "elvis"
    open-pull-requests-limit: 10

  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend-next"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    groups:
      development-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "typescript*"
          - "tailwind*"
          - "postcss*"
          - "autoprefixer*"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@stripe/*"
          - "@tanstack/*"
          - "clsx"
          - "tailwind-merge"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
    reviewers:
      - "elvis"
    assignees:
      - "elvis"
    open-pull-requests-limit: 10

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "elvis"