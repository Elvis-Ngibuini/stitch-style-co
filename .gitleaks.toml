[gitleaks]
  # Generic patterns
  path = ""
  verbose = false
  no-git = false
  follow-symlinks = false
  log-opts = "--all"
  
  # Allowlist paths
  allowlist-files = [
    "*.example",
    "*.template",
    "*.sample",
    ".gitignore",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "*.md",
    "package-lock.json",
    "yarn.lock",
    "pnpm-lock.yaml",
    "*.lock",
    "*.sum",
    "jest.config.js",
    "jest.setup.js",
    "*.test.js",
    "*.test.ts",
    "*.spec.js",
    "*.spec.ts",
    "__tests__/**",
    "tests/**",
    "test/**",
    "cypress/**",
    "playwright/**"
  ]
  
  # Allowlist commits (if needed)
  allowlist-commits = []

  # Rules
  [[rules]]
    id = "generic-api-key"
    description = "Generic API Key"
    regex = "(?i)(api[_-]?key|apikey|secret[_-]?key|access[_-]?token)[\\s]*[:=][\\s]*[\"']?[a-zA-Z0-9_-]{20,}[\"']?"
    tags = ["key", "api"]
    entropy = 0.0

  [[rules]]
    id = "generic-password"
    description = "Generic Password"
    regex = "(?i)(password|passwd|pwd)[\\s]*[:=][\\s]*[\"']?[^\"'\\s]{8,}[\"']?"
    tags = ["password"]
    entropy = 0.0

  [[rules]]
    id = "jwt-secret"
    description = "JWT Secret"
    regex = "(?i)(jwt[_-]?secret|jwt[_-]?key)[\\s]*[:=][\\s]*[\"']?[a-zA-Z0-9_-]{32,}[\"']?"
    tags = ["jwt", "secret"]
    entropy = 0.0

  [[rules]]
    id = "stripe-secret-key"
    description = "Stripe Secret Key"
    regex = "sk_(live|test)_[a-zA-Z0-9]{24,}"
    tags = ["stripe", "secret", "key"]
    entropy = 0.0

  [[rules]]
    id = "stripe-publishable-key"
    description = "Stripe Publishable Key"
    regex = "pk_(live|test)_[a-zA-Z0-9]{24,}"
    tags = ["stripe", "key"]
    entropy = 0.0

  [[rules]]
    id = "stripe-webhook-secret"
    description = "Stripe Webhook Secret"
    regex = "whsec_[a-zA-Z0-9]{32,}"
    tags = ["stripe", "webhook", "secret"]
    entropy = 0.0

  [[rules]]
    id = "mongodb-uri"
    description = "MongoDB Connection String"
    regex = "mongodb(\\+srv)?://[^\\s\"']+"
    tags = ["mongodb", "database", "connection"]
    entropy = 0.0

  [[rules]]
    id = "aws-access-key"
    description = "AWS Access Key ID"
    regex = "AKIA[0-9A-Z]{16}"
    tags = ["aws", "key"]
    entropy = 0.0

  [[rules]]
    id = "aws-secret-key"
    description = "AWS Secret Access Key"
    regex = "(?i)aws(.{0,20})?[\\s]*[:=][\\s]*[\"']?[A-Za-z0-9/+=]{40}[\"']?"
    tags = ["aws", "secret"]
    entropy = 0.0

  [[rules]]
    id = "github-token"
    description = "GitHub Personal Access Token"
    regex = "gh[pousr]_[A-Za-z0-9_]{36,251}"
    tags = ["github", "token"]
    entropy = 0.0

  [[rules]]
    id = "slack-token"
    description = "Slack Token"
    regex = "xox[baprs]-[0-9a-zA-Z]{10,48}"
    tags = ["slack", "token"]
    entropy = 0.0

  [[rules]]
    id = "sendgrid-key"
    description = "SendGrid API Key"
    regex = "SG\\.[A-Za-z0-9_-]{22}\\.[A-Za-z0-9_-]{43}"
    tags = ["sendgrid", "key"]
    entropy = 0.0

  [[rules]]
    id = "mailgun-key"
    description = "Mailgun API Key"
    regex = "key-[0-9a-zA-Z]{32}"
    tags = ["mailgun", "key"]
    entropy = 0.0

  [[rules]]
    id = "twilio-key"
    description = "Twilio API Key"
    regex = "SK[0-9a-fA-F]{32}"
    tags = ["twilio", "key"]
    entropy = 0.0

  [[rules]]
    id = "private-key"
    description = "Private Key"
    regex = "-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
    tags = ["private", "key"]
    entropy = 0.0

  [[rules]]
    id = "base64-encoded-secret"
    description = "Base64 encoded secret (high entropy)"
    regex = "[A-Za-z0-9+/]{40,}={0,2}"
    entropy = 4.5
    tags = ["base64", "encoded", "secret"]
    allowlist-regex = "^(eyJ|YW5vbnltb3Vz|YXBw|YXV0aG9yaXphdGlvbg==)$"