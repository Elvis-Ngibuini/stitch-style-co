# =============================================================================
# Docker Compose - Development Environment
# =============================================================================
# Usage: docker-compose up -d
#        docker-compose -f docker-compose.yml -f docker-compose.override.yml up -d
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # MongoDB - Primary Database
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: stitch-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: stitch-style-co-dev
      MONGO_INITDB_ROOT_USERNAME: devuser
      MONGO_INITDB_ROOT_PASSWORD: devpassword
    ports:
      - "27017:27017"
    volumes:
      - mongodb-dev-data:/data/db
      - mongodb-dev-config:/data/configdb
    networks:
      - stitch-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles:
      - database

  # ---------------------------------------------------------------------------
  # MongoDB Express - Database Admin UI
  # ---------------------------------------------------------------------------
  mongo-express:
    image: mongo-express:1.0
    container_name: stitch-mongo-express-dev
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: devuser
      ME_CONFIG_MONGODB_ADMINPASSWORD: devpassword
      ME_CONFIG_MONGODB_URL: mongodb://devuser:devpassword@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - stitch-network
    profiles:
      - database
      - tools

  # ---------------------------------------------------------------------------
  # Redis - Caching & Sessions
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: stitch-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    networks:
      - stitch-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles:
      - cache

  # ---------------------------------------------------------------------------
  # Backend API - Development
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: stitch-backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5006
      MONGO_URI: mongodb://devuser:devpassword@mongodb:27017/stitch-style-co-dev?authSource=admin
      JWT_SECRET: dev-jwt-secret-key-min-32-characters-long-for-testing
      JWT_REFRESH_SECRET: dev-refresh-secret-key-min-32-characters-long
      JWT_EXPIRE: 15m
      JWT_REFRESH_EXPIRE: 7d
      STRIPE_SECRET_KEY: sk_test_dev
      STRIPE_PUBLISHABLE_KEY: pk_test_dev
      STRIPE_WEBHOOK_SECRET: whsec_dev
      FRONTEND_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379
    ports:
      - "5006:5006"
    volumes:
      - .:/app
      - /app/node_modules
      - uploads-dev:/app/uploads
      - logs-dev:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stitch-network
    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------------
  # Frontend - Development
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
      target: development
    container_name: stitch-frontend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:5006/api
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_dev
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-next:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - stitch-network
    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------------
  # Mailhog - Email Testing
  # ---------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: stitch-mailhog-dev
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - stitch-network
    profiles:
      - tools

  # ---------------------------------------------------------------------------
  # MinIO - S3-compatible Object Storage (for uploads)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: stitch-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio-dev-data:/data
    networks:
      - stitch-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    profiles:
      - storage

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  stitch-network:
    driver: bridge
    name: stitch-dev-network

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  mongodb-dev-data:
    name: stitch-mongodb-dev-data
  mongodb-dev-config:
    name: stitch-mongodb-dev-config
  redis-dev-data:
    name: stitch-redis-dev-data
  uploads-dev:
    name: stitch-uploads-dev
  logs-dev:
    name: stitch-logs-dev
  minio-dev-data:
    name: stitch-minio-dev-data